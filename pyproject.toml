[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etoro-mcp"
version = "0.1.0"
description = "MCP server para la API pública de eToro con reglas de riesgo y aprobación humana obligatoria antes de operar."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etoro-mcp = "etoro_mcp.server:main"

[tool.setuptools]
packages = ["etoro_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
